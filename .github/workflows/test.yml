name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
            build-essential

      - name: Build
        run: ./bin/build

      - name: Test
        run: ./bin/test
        env:
          QT_QPA_PLATFORM: offscreen
